name: Release

# Push a tag like v0.1.0 (matching __version__) to publish to PyPI and create a GitHub release
# with the Alfred workflow attached. See RELEASING.md.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Check tag matches package version
        run: |
          version=$(uv run --no-project python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/roon_discord_presence/__init__.py').read_text())[1])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - run: uv run python integrations/alfred/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing, no API token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: rm dist/*.alfredworkflow
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
