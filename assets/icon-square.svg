<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>roon-discord-presence (square)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b78ff"/>
      <stop offset="1" stop-color="#3a2db5"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.35" stop-color="#2b2a38"/>
      <stop offset="1" stop-color="#101016"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- vinyl record -->
  <circle cx="236" cy="252" r="170" fill="#000" opacity="0.25" transform="translate(6 10)"/>
  <circle cx="236" cy="252" r="170" fill="url(#disc)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2.5">
    <circle cx="236" cy="252" r="148"/>
    <circle cx="236" cy="252" r="128"/>
    <circle cx="236" cy="252" r="108"/>
    <circle cx="236" cy="252" r="88"/>
  </g>
  <path d="M 108 160 A 156 156 0 0 1 330 118" fill="none" stroke="url(#sheen)"
        stroke-width="14" stroke-linecap="round"/>

  <!-- label with equalizer bars -->
  <circle cx="236" cy="252" r="62" fill="#f4f2ff"/>
  <g fill="#4b3fd1">
    <rect x="206" y="243" width="12" height="34" rx="6"/>
    <rect x="230" y="227" width="12" height="50" rx="6"/>
    <rect x="254" y="237" width="12" height="40" rx="6"/>
  </g>

  <!-- presence indicator -->
  <circle cx="390" cy="390" r="74" fill="#4a3fc7"/>
  <circle cx="390" cy="390" r="54" fill="#23a55a"/>
</svg>
